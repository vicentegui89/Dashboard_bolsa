<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Evolution Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .top-bar {
            width: 95%;
            max-width: 1600px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .range-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            flex: 1;
        }
        .range-selector button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            background-color: #334155;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .range-selector button:hover { background-color: #3b82f6; }
        .range-selector button.active {
            background-color: #2563eb;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.5);
        }
        .config-btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background-color: #334155;
            color: white;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .config-btn:hover { background-color: #3b82f6; transform: rotate(45deg); }

        .charts-grid {
            width: 95%;
            max-width: 1600px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 20px;
            margin: 15px 0 20px;
        }
        .chart-card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .chart-title {
            padding: 10px 15px;
            font-weight: bold;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .chart-container {
            width: 100%;
            height: 45vh;
            min-height: 320px;
        }
        .footer {
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            padding: 0 10px;
        }
        .empty-state {
            grid-column: 1 / -1;
            padding: 40px 20px;
            text-align: center;
            color: #94a3b8;
            background: #1e293b;
            border-radius: 12px;
            border: 1px dashed #334155;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            padding: 20px;
            width: 100%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }
        .modal h2 {
            margin: 0 0 15px;
            font-size: 1.2rem;
        }
        .modal h3 {
            font-size: 0.95rem;
            margin: 0 0 8px;
            color: #cbd5e1;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 14px;
            background: transparent;
            color: #94a3b8;
            border: none;
            cursor: pointer;
            font-size: 1.4rem;
            line-height: 1;
            padding: 0;
        }
        .modal-close:hover { color: white; }
        .asset-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px;
        }
        .asset-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #0f172a;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .asset-list .meta { color: #94a3b8; font-size: 0.8rem; }
        .asset-list .del {
            background: transparent;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
        }
        .asset-list .del:hover { background: rgba(239, 68, 68, 0.15); border-radius: 4px; }

        /* Autocompletado */
        .search-wrap {
            position: relative;
        }
        .search-input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 0.95rem;
        }
        .search-input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            max-height: 320px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .dropdown.open { display: block; }
        .dropdown-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover, .dropdown-item.highlighted {
            background: #1e293b;
        }
        .dropdown-item .ticker {
            font-weight: bold;
            font-size: 0.9rem;
        }
        .dropdown-item .desc {
            font-size: 0.78rem;
            color: #94a3b8;
            margin-top: 2px;
        }
        .dropdown-item .right {
            text-align: right;
            font-size: 0.75rem;
            color: #94a3b8;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .dropdown-item .type {
            display: inline-block;
            padding: 1px 6px;
            background: #334155;
            border-radius: 10px;
            font-size: 0.7rem;
            color: #cbd5e1;
            margin-bottom: 2px;
        }
        .dropdown-empty, .dropdown-loading {
            padding: 12px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .hint {
            font-size: 0.75rem;
            color: #94a3b8;
            margin: 6px 0 0;
        }
        .form-error {
            color: #f87171;
            font-size: 0.8rem;
            margin-top: 6px;
            min-height: 1em;
        }

        @media (max-width: 500px) {
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="range-selector" id="range-selector"></div>
    <button class="config-btn" id="config-btn" title="Configurar valores">⚙</button>
</div>

<div class="charts-grid" id="charts-grid"></div>

<div class="footer">
    Datos en tiempo real proporcionados por TradingView
</div>

<!-- Modal de configuración -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <button class="modal-close" id="modal-close" title="Cerrar">×</button>
        <h2>Configurar valores</h2>

        <h3>Valores actuales</h3>
        <ul class="asset-list" id="asset-list"></ul>

        <h3>Añadir nuevo valor</h3>
        <div class="search-wrap">
            <input type="text" id="search-input" class="search-input" placeholder="Busca por nombre o símbolo (ej. Apple, AAPL, Santander...)" autocomplete="off" />
            <div class="dropdown" id="dropdown"></div>
        </div>
        <p class="hint">Empieza a escribir y elige una opción del desplegable.</p>
        <div class="form-error" id="form-error"></div>
    </div>
</div>

<script type="text/javascript">
    const DEFAULT_ASSETS = [
        { symbol: 'NASDAQ:AMZN', name: 'Amazon' },
        { symbol: 'NASDAQ:AVGO', name: 'Broadcom' },
        { symbol: 'NASDAQ:MCHI', name: 'MSCI China (ETF)' },
        { symbol: 'NASDAQ:WDC',  name: 'Western Digital' },
        { symbol: 'NASDAQ:NVDA', name: 'Nvidia' }
    ];

    const STORAGE_KEY = 'tv_dashboard_assets_v1';

    function loadAssets() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return [...DEFAULT_ASSETS];
            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) return [...DEFAULT_ASSETS];
            return parsed.filter(a => a && a.symbol && a.name);
        } catch (e) {
            return [...DEFAULT_ASSETS];
        }
    }
    function saveAssets() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(assets)); } catch (e) {}
    }

    let assets = loadAssets();

    const ranges = [
        { label: '1D',   value: '1D'   },
        { label: '5D',   value: '5D'   },
        { label: '1M',   value: '1M'   },
        { label: '3M',   value: '3M'   },
        { label: '6M',   value: '6M'   },
        { label: 'YTD',  value: 'YTD'  },
        { label: '1A',   value: '12M'  },
        { label: '5A',   value: '60M'  },
        { label: 'Todo', value: 'ALL'  }
    ];
    let currentRangeIdx = 6;

    function loadOverview(containerId, symbol, displayName, defaultRange) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        const wrapper = document.createElement('div');
        wrapper.className = 'tradingview-widget-container';
        wrapper.style.width = '100%';
        wrapper.style.height = '100%';
        const inner = document.createElement('div');
        inner.className = 'tradingview-widget-container__widget';
        inner.style.width = '100%';
        inner.style.height = '100%';
        wrapper.appendChild(inner);

        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.async = true;
        script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js';
        script.innerHTML = JSON.stringify({
            "symbols": [[displayName, symbol + "|" + defaultRange]],
            "chartOnly": false,
            "width": "100%",
            "height": "100%",
            "locale": "es",
            "colorTheme": "dark",
            "autosize": true,
            "showVolume": false,
            "showMA": false,
            "hideDateRanges": false,
            "hideMarketStatus": false,
            "hideSymbolLogo": false,
            "scalePosition": "right",
            "scaleMode": "Normal",
            "fontFamily": "Trebuchet MS, sans-serif",
            "fontSize": "10",
            "noTimeScale": false,
            "valuesTracking": "1",
            "changeMode": "price-and-percent",
            "chartType": "line",
            "dateRanges": ["1d|5", "5d|15", "1m|60", "3m|120", "6m|1D", "ytd|1D", "12m|1D", "60m|1W", "all|1W"],
            "defaultRange": defaultRange,
            "isTransparent": true
        });
        wrapper.appendChild(script);
        container.appendChild(wrapper);
    }

    function renderGrid() {
        const grid = document.getElementById('charts-grid');
        grid.innerHTML = '';
        if (assets.length === 0) {
            grid.innerHTML = '<div class="empty-state">No hay valores configurados. Pulsa el botón ⚙ arriba a la derecha para añadir alguno.</div>';
            return;
        }
        const range = ranges[currentRangeIdx].value;
        assets.forEach((asset, i) => {
            const containerId = 'tv_widget_' + i;
            const card = document.createElement('div');
            card.className = 'chart-card';
            card.innerHTML = `
                <div class="chart-title">
                    <span>${asset.name} <span style="color:#94a3b8;font-weight:normal">· ${asset.symbol}</span></span>
                </div>
                <div class="chart-container" id="${containerId}"></div>
            `;
            grid.appendChild(card);
            loadOverview(containerId, asset.symbol, asset.name, range);
        });
    }

    function buildRangeSelector() {
        const sel = document.getElementById('range-selector');
        sel.innerHTML = '';
        ranges.forEach((r, i) => {
            const btn = document.createElement('button');
            btn.textContent = r.label;
            if (i === currentRangeIdx) btn.classList.add('active');
            btn.onclick = () => {
                currentRangeIdx = i;
                document.querySelectorAll('.range-selector button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderGrid();
            };
            sel.appendChild(btn);
        });
    }

    // --- Modal ---
    const modal = document.getElementById('modal');
    const formError = document.getElementById('form-error');
    const searchInput = document.getElementById('search-input');
    const dropdown = document.getElementById('dropdown');

    function openModal() {
        renderAssetList();
        formError.textContent = '';
        searchInput.value = '';
        dropdown.classList.remove('open');
        modal.classList.add('open');
        setTimeout(() => searchInput.focus(), 50);
    }
    function closeModal() {
        modal.classList.remove('open');
        dropdown.classList.remove('open');
    }

    document.getElementById('config-btn').onclick = openModal;
    document.getElementById('modal-close').onclick = closeModal;
    modal.onclick = (e) => { if (e.target === modal) closeModal(); };

    function renderAssetList() {
        const ul = document.getElementById('asset-list');
        ul.innerHTML = '';
        if (assets.length === 0) {
            ul.innerHTML = '<li style="color:#94a3b8;justify-content:center;">No hay valores</li>';
            return;
        }
        assets.forEach((a, i) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <span><strong>${escapeHtml(a.name)}</strong> <span class="meta">· ${escapeHtml(a.symbol)}</span></span>
                <button class="del" title="Quitar" data-i="${i}">✕</button>
            `;
            li.querySelector('.del').onclick = () => removeAsset(i);
            ul.appendChild(li);
        });
    }
    function removeAsset(i) {
        assets.splice(i, 1);
        saveAssets();
        renderAssetList();
        renderGrid();
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }
    // Quita las etiquetas tipo <em>...</em> que la API devuelve para resaltar coincidencias
    function stripTags(s) { return String(s || '').replace(/<[^>]+>/g, ''); }

    // --- Autocompletado contra la API pública de TradingView ---
    let searchTimer = null;
    let activeRequest = 0;
    let currentResults = [];
    let highlightedIdx = -1;

    async function searchSymbols(query) {
        const myId = ++activeRequest;
        const tvUrl = 'https://symbol-search.tradingview.com/symbol_search/v3/?text=' +
                    encodeURIComponent(query) +
                    '&hl=1&exchange=&lang=es&search_type=&domain=production';
        // Proxies CORS públicos como fallback. TradingView no permite llamadas
        // directas desde otros dominios, así que pasamos por intermediarios.
        const proxies = [
            u => 'https://corsproxy.io/?' + encodeURIComponent(u),
            u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
            u => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u)
        ];

        for (const buildUrl of proxies) {
            try {
                const res = await fetch(buildUrl(tvUrl));
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (myId !== activeRequest) return;
                const items = Array.isArray(data?.symbols) ? data.symbols : [];
                currentResults = items.slice(0, 20).map(it => ({
                    symbol: stripTags(it.symbol),
                    description: stripTags(it.description),
                    exchange: stripTags(it.exchange || it.exchange_name || ''),
                    prefix: stripTags(it.prefix || it.exchange || ''),
                    type: stripTags(it.type || '')
                }));
                renderDropdown();
                return;
            } catch (e) {
                // probar siguiente proxy
            }
        }
        if (myId !== activeRequest) return;
        dropdown.innerHTML = '<div class="dropdown-empty">Error buscando. Revisa tu conexión.</div>';
        dropdown.classList.add('open');
    }

    function renderDropdown() {
        dropdown.innerHTML = '';
        if (currentResults.length === 0) {
            dropdown.innerHTML = '<div class="dropdown-empty">Sin resultados</div>';
            dropdown.classList.add('open');
            return;
        }
        highlightedIdx = -1;
        currentResults.forEach((r, i) => {
            const item = document.createElement('div');
            item.className = 'dropdown-item';
            const fullSymbol = (r.prefix ? r.prefix + ':' : '') + r.symbol;
            item.dataset.symbol = fullSymbol;
            item.dataset.name = r.description || r.symbol;
            item.innerHTML = `
                <div style="min-width:0;">
                    <div class="ticker">${escapeHtml(r.symbol)}</div>
                    <div class="desc">${escapeHtml(r.description || '')}</div>
                </div>
                <div class="right">
                    ${r.type ? `<div class="type">${escapeHtml(r.type)}</div>` : ''}
                    <div>${escapeHtml(r.exchange || r.prefix || '')}</div>
                </div>
            `;
            item.onclick = () => selectResult(i);
            item.onmouseenter = () => setHighlight(i);
            dropdown.appendChild(item);
        });
        dropdown.classList.add('open');
    }

    function setHighlight(i) {
        const items = dropdown.querySelectorAll('.dropdown-item');
        items.forEach(el => el.classList.remove('highlighted'));
        if (i >= 0 && i < items.length) {
            items[i].classList.add('highlighted');
            items[i].scrollIntoView({ block: 'nearest' });
        }
        highlightedIdx = i;
    }

    function selectResult(i) {
        const r = currentResults[i];
        if (!r) return;
        const fullSymbol = (r.prefix ? r.prefix + ':' : '') + r.symbol;
        const displayName = r.description || r.symbol;
        if (assets.some(a => a.symbol === fullSymbol)) {
            formError.textContent = 'Ese símbolo ya está añadido.';
            return;
        }
        assets.push({ symbol: fullSymbol, name: displayName });
        saveAssets();
        searchInput.value = '';
        dropdown.classList.remove('open');
        currentResults = [];
        formError.textContent = '';
        renderAssetList();
        renderGrid();
    }

    searchInput.addEventListener('input', () => {
        const q = searchInput.value.trim();
        formError.textContent = '';
        clearTimeout(searchTimer);
        if (q.length < 1) {
            dropdown.classList.remove('open');
            currentResults = [];
            return;
        }
        dropdown.innerHTML = '<div class="dropdown-loading">Buscando…</div>';
        dropdown.classList.add('open');
        searchTimer = setTimeout(() => searchSymbols(q), 250);
    });

    searchInput.addEventListener('keydown', (e) => {
        if (!dropdown.classList.contains('open') || currentResults.length === 0) return;
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            setHighlight(Math.min(highlightedIdx + 1, currentResults.length - 1));
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setHighlight(Math.max(highlightedIdx - 1, 0));
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (highlightedIdx >= 0) selectResult(highlightedIdx);
            else if (currentResults.length > 0) selectResult(0);
        } else if (e.key === 'Escape') {
            dropdown.classList.remove('open');
        }
    });

    // Cierra el desplegable al hacer click fuera
    document.addEventListener('click', (e) => {
        if (!dropdown.contains(e.target) && e.target !== searchInput) {
            dropdown.classList.remove('open');
        }
    });

    buildRangeSelector();
    renderGrid();
</script>

</body>
</html>
